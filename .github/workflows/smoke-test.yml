name: APK smoke test
on:
  workflow_dispatch:
    inputs:
      test_class:
        description: 'Run only this instrumented test class (e.g. io.github.danzuep.usfmbible.translations.OpenFileTest for the "Open with" USFM/zip/Markdown tests); blank runs all'
        required: false
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v6
    - uses: ./.github/actions/bundle-web
    - run: ./gradlew assembleRelease -PbundledAssetsDir="$PWD/bundled-assets"
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        script: bash .github/scripts/smoke-test.sh
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: smoke-results
        path: |
          logcat.txt
          screen.png
          screen-bookmarked.png
          screen-chapter.png
          screen-ruby.png
          ui.xml
          ui-search.xml

  # Instrumented tests (app/src/androidTest) run in the app's own process, so they can use the shared fluent builders.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v6
    - uses: ./.github/actions/bundle-web
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        script: bash .github/scripts/instrumented.sh "${{ inputs.test_class }}"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: instrumented-results
        path: |
          app/build/reports/androidTests
          shots
        if-no-files-found: ignore
