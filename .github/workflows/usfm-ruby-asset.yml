name: USFM asset ruby annotations

on:
  workflow_dispatch:
    inputs:
      translation:
        description: eBible translation ID to download (downloaded from <base_url>/<id><suffix>)
        default: cmn-ncvt
      base_url:
        description: Override the download base URL
        default: https://ebible.org/Scriptures
      suffix:
        description: Override the download file suffix
        default: _usfm.zip
      language:
        description: Language code for the readings (zh-HK adds Jyutping)
        default: zh-HK
      release_tag:
        description: Release that receives the zip as an asset
        default: usfm-ruby-assets

permissions:
  contents: write

concurrency:
  group: usfm-ruby-assets-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRANSLATION: ${{ inputs.translation || 'cmn-ncvt' }}
      BASE_URL: ${{ inputs.base_url || 'https://ebible.org/Scriptures' }}
      SUFFIX: ${{ inputs.suffix || '_usfm.zip' }}
      LANGUAGE: ${{ inputs.language || 'zh-HK' }}
      TAG: ${{ inputs.release_tag || 'usfm-ruby-assets' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: danzuep/PhoneticAnnotator
          path: phonetic
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Name the zip
        run: echo "NAME=${TRANSLATION//-/_}_${LANGUAGE}" >> "$GITHUB_ENV"
      - name: Download USFM and add ruby
        run: |
          mkdir -p dist
          curl -fsSL "${BASE_URL%/}/${TRANSLATION}${SUFFIX}" -o full.zip
          dotnet run -c Release --project phonetic/src/PhoneticAnnotator.Cli -- \
            --data phonetic/data/Unihan_Readings.txt --language "$LANGUAGE" \
            --usfm-in full.zip --usfm-out "dist/${NAME}.zip"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}.zip
      - name: Publish release asset
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "USFM assets (Macula Greek and Hebrew, ruby text)" --prerelease
          gh release upload "$TAG" "dist/${NAME}.zip" --clobber
