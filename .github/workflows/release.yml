name: Release APK
on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The signing secrets live in the `release` environment, which only v* tags may deploy to.
    # Other refs (dry runs) use the secret-less `dry-run` environment and sign with the debug key.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dry-run' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v6
    # Robolectric downloads its android-all jars from Maven Central into ~/.m2 at test time; cache them so a Maven outage doesn't fail the build.
    - uses: actions/cache@v5
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-${{ runner.os }}-${{ hashFiles('buildSrc/src/main/kotlin/Configurations.kt', 'app/src/test/resources/robolectric.properties') }}
        restore-keys: robolectric-${{ runner.os }}-
    - name: Restore signing keystore (optional)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "KEYSTORE_FILE=release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > keystore.properties
        fi
    - name: Resolve version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          version=${GITHUB_REF_NAME#v}
          version=${version%%+*}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NAME=UsfmBible-v$version" >> "$GITHUB_ENV"
        else
          echo "VERSION=" >> "$GITHUB_ENV"
          echo "NAME=UsfmBible-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
        fi
    - name: Build APK
      run: |
        # Robolectric's artifact download can fail transiently, so retry the tests once.
        ./gradlew testDebugUnitTest || ./gradlew testDebugUnitTest
        ./gradlew assembleRelease ${VERSION:+-PappVersion=$VERSION}
        cp app/build/outputs/apk/release/app-release.apk "$NAME.apk"
    - name: Build AAB for Google Play
      run: |
        ./gradlew bundleRelease ${VERSION:+-PappVersion=$VERSION}
        cp app/build/outputs/bundle/release/app-release.aab "$NAME.aab"
    - name: Download the WEB Bible to prepackage
      run: |
        mkdir -p bundle-src/translations
        curl -fsSL "https://ebible.org/Scriptures/engwebp_usfm.zip" -o bundle-src/translations/engwebp.zip
        printf 'engwebp\tWorld English Bible\teng\n' > bundle-src/list.tsv
    - name: Parse the WEB Bible into a prebuilt database
      run: |
        # Writes bundle-src/bundled/bundled.db, so the app does not parse the USFM on first launch.
        BUNDLE_DIR="$PWD/bundle-src" ./gradlew cleanTestDebugUnitTest testDebugUnitTest --tests '*BundledDatabaseGenerator'
        mkdir -p bundled-assets/bundled
        # The app unzips this on first run; zip -9 shrinks the SQLite file far more than the APK's default deflate.
        (cd bundle-src/bundled && zip -9 -q "$OLDPWD/bundled-assets/bundled/bundled.db.zip" bundled.db)
        cp -r bundle-src/bundled/copyright bundled-assets/bundled/ || echo "No copyright notices found"
        ls -l bundle-src/bundled/bundled.db bundled-assets/bundled/bundled.db.zip
    - name: Build APK with the WEB Bible prepackaged
      run: |
        ./gradlew assembleRelease -PbundledAssetsDir="$PWD/bundled-assets" -PdefaultBookIndex=42 ${VERSION:+-PappVersion=$VERSION}
        cp app/build/outputs/apk/release/app-release.apk "$NAME-with-WEB.apk"
    - name: Report artifact sizes
      run: |
        {
          echo "### Artifact sizes"
          echo "| File | Size (MiB) |"
          echo "|------|-----------|"
          for f in "$NAME.apk" "$NAME.aab" "$NAME-with-WEB.apk"; do
            echo "| $f | $(awk -v b="$(stat -c %s "$f")" 'BEGIN { printf "%.2f", b / 1048576 }') |"
          done
        } >> "$GITHUB_STEP_SUMMARY"
        # Fail if the plain APK exceeds the budget (MiB); raise it deliberately when the app grows.
        max_mib=${APK_MAX_MIB:-3}
        size=$(stat -c %s "$NAME.apk")
        if [ "$size" -gt $((max_mib * 1048576)) ]; then
          echo "::error::$NAME.apk is $size bytes, over the ${max_mib} MiB budget"
          exit 1
        fi
    - uses: actions/upload-artifact@v7
      with:
        name: apk
        path: UsfmBible-*.apk
    # Not attached to the GitHub release: upload it to Play with fastlane or Play Console.
    - uses: actions/upload-artifact@v7
      with:
        name: aab
        path: UsfmBible-*.aab
    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" "$NAME.apk" "$NAME-with-WEB.apk" --generate-notes --latest=false
        # Runs for several tags can overlap, so mark the highest version (not the last one published) as Latest.
        newest=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | sort -V | tail -n1)
        gh release edit "$newest" --latest

  # Self-hosted F-Droid repo with only this release's APK, indexed with the release keystore.
  fdroid:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v7
      with:
        name: apk
        path: apk
    - name: Build the repo index
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Missing release keystore secrets"; exit 1; fi
        pip install fdroidserver
        sudo apt-get install -y --no-install-recommends apksigner || true
        owner=${GITHUB_REPOSITORY_OWNER,,}
        repo=${GITHUB_REPOSITORY#*/}
        mkdir -p site/repo
        cp apk/UsfmBible-v*[0-9].apk site/repo/
        cp -r fdroid/metadata site/metadata
        cd site
        umask 077
        echo "$KEYSTORE_BASE64" | base64 -d > keystore.p12
        cat > config.yml <<EOC
        repo_url: https://$owner.github.io/$repo/fdroid/repo
        repo_name: UsfmBible
        repo_description: Only the latest UsfmBible release.
        repo_keyalias: $KEY_ALIAS
        keystore: keystore.p12
        keystorepass: $KEYSTORE_PASSWORD
        keypass: $KEY_PASSWORD
        keydname: CN=UsfmBible, O=danzuep
        archive_older: 0
        EOC
        export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
        fdroid update --clean
        rm -f keystore.p12 config.yml
        cd ..
        curl -sL https://github.com/gohugoio/hugo/releases/download/v0.147.0/hugo_0.147.0_linux-amd64.tar.gz | tar xz hugo
        ./hugo --source website --destination "$PWD/pages" --minify
        mkdir -p pages/fdroid
        mv site/repo pages/fdroid/repo
        ls -R pages
    - uses: actions/upload-pages-artifact@v5
      with:
        path: pages

  deploy-fdroid:
    needs: fdroid
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
