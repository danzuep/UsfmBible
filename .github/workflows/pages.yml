name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'fastlane/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment holds both the site and the F-Droid repo, so never deploy two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7
    - name: Build the site
      run: |
        curl -sL https://github.com/gohugoio/hugo/releases/download/v0.147.0/hugo_0.147.0_linux-amd64.tar.gz | tar xz hugo
        ./hugo --source website --destination "$PWD/pages" --minify
    # The deployed F-Droid repo is only built by release.yml, so carry it over from the latest deployment.
    - name: Keep the published F-Droid repo
      run: |
        run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages&per_page=100" \
          --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id')
        if [ -z "$run_id" ] || [ "$run_id" = null ]; then echo "::error::No previous Pages artifact found, publish a release first"; exit 1; fi
        mkdir previous
        gh run download "$run_id" -n github-pages -D previous
        tar -xf previous/artifact.tar -C previous
        if [ ! -d previous/fdroid/repo ]; then echo "::error::Previous deployment has no fdroid/repo"; exit 1; fi
        cp -r previous/fdroid pages/fdroid
        ls pages pages/fdroid/repo | head -30
    - uses: actions/upload-pages-artifact@v5
      with:
        path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
