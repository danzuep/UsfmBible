name: F-Droid repo
# Publishes a self-hosted F-Droid repo containing only the latest release APK to GitHub Pages.
# Needs the repo secrets FDROID_KEYSTORE_BASE64, FDROID_KEYSTORE_PASSWORD, FDROID_KEY_ALIAS and
# FDROID_KEY_PASSWORD (the repo index signing key, see docs/FDROID.md).
on:
  workflow_run:
    workflows: ['Release APK']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: fdroid
  cancel-in-progress: false

jobs:
  build:
    # Dry runs of Release APK on other refs publish nothing, so only react to tag runs.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
    steps:
    - uses: actions/checkout@v7
    - name: Check the repo signing key
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::Missing FDROID_KEYSTORE_BASE64, see docs/FDROID.md"
          exit 1
        fi
    - name: Download only the latest release APK
      run: |
        mkdir -p site/repo
        tag=$(gh release view --json tagName -q .tagName)
        gh release download "$tag" --pattern 'UsfmBible-v*[0-9].apk' --dir site/repo
        ls -l site/repo
    - name: Install fdroidserver
      run: |
        pip install fdroidserver
        sudo apt-get install -y --no-install-recommends apksigner || true
    - name: Build the repo index
      env:
        KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
      run: |
        owner=${GITHUB_REPOSITORY_OWNER,,}
        repo=${GITHUB_REPOSITORY#*/}
        cd site
        cp -r ../fdroid/metadata metadata
        echo "$KEYSTORE_BASE64" | base64 -d > keystore.p12
        umask 077
        cat > config.yml <<EOF
        repo_url: https://$owner.github.io/$repo/fdroid/repo
        repo_name: UsfmBible
        repo_description: Only the latest UsfmBible release.
        repo_keyalias: $KEY_ALIAS
        keystore: keystore.p12
        keystorepass: $KEYSTORE_PASSWORD
        keypass: $KEY_PASSWORD
        keydname: CN=UsfmBible, O=danzuep
        archive_older: 0
        EOF
        chmod 600 config.yml
        export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
        fdroid update --clean
        rm -f keystore.p12 config.yml
        ls repo
    - name: Add the landing page
      run: |
        mkdir -p pages/fdroid
        mv site/repo pages/fdroid/repo
        cat > pages/index.html <<'EOF'
        <!doctype html>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>UsfmBible on F-Droid</title>
        <h1>UsfmBible</h1>
        <p>Add this repository in F-Droid (Settings, Repositories) to install and update UsfmBible:</p>
        <p><a id="u"></a></p>
        <script>
          var u = location.origin + location.pathname.replace(/[^/]*$/, '') + 'fdroid/repo';
          var a = document.getElementById('u'); a.href = 'fdroidrepos://' + u.replace(/^https?:\/\//, ''); a.textContent = u;
        </script>
        EOF
    - uses: actions/upload-pages-artifact@v3
      with:
        path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
