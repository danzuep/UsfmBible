name: Update store icons

on:
  push:
    branches: [main]
    paths:
      - 'arts/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/update-store-icons.yml'
  pull_request:
    paths:
      - 'arts/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/update-store-icons.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref || github.ref_name }}
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v6
    - name: Install rsvg-convert
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin
    - name: Render the store icon from arts/ic_launcher.svg
      run: |
        mkdir -p fastlane/metadata/android/en-US/images
        rsvg-convert -w 512 -h 512 arts/ic_launcher.svg -o fastlane/metadata/android/en-US/images/icon.png
    - name: Generate the launcher vector from arts/ic_launcher.svg
      run: ./gradlew :app:generateLauncherIcon
    - name: Commit the icons to the pull request branch
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      run: |
        git add fastlane/metadata/android/en-US/images/icon.png app/src/main/res/drawable-v24/ic_launcher_foreground.xml
        if git diff --cached --quiet; then
          echo "No changes"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Update store icons"
        git push origin "HEAD:${{ github.head_ref }}"
    - name: Open a pull request if the icons changed
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -z "$(git status --porcelain)" ]; then
          echo "No changes"
          exit 0
        fi
        branch=update-store-icons-$(date +%Y%m%d%H%M%S)
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "$branch"
        git add fastlane/metadata/android/en-US/images/icon.png app/src/main/res/drawable-v24/ic_launcher_foreground.xml
        git commit -m "Update store icons"
        git push origin "$branch"
        gh pr create --title "Update store icons" --body "Rendered from arts/ic_launcher.svg" --base main
