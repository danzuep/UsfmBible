# Modified by Daniel Collingwood, 2026
name: Android CI
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'

# A newer push to the same PR makes the older run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v6
    # Robolectric downloads its android-all jars from Maven Central into ~/.m2 at test time; cache them so a Maven outage doesn't fail the build.
    - uses: actions/cache@v5
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-${{ runner.os }}-${{ hashFiles('buildSrc/src/main/kotlin/Configurations.kt', 'app/src/test/resources/robolectric.properties') }}
        restore-keys: robolectric-${{ runner.os }}-
    - name: Build and test
      timeout-minutes: 15
      run: |
        # Robolectric's artifact download can fail transiently, so retry the tests once.
        ./gradlew testDebugUnitTest || ./gradlew testDebugUnitTest
        ./gradlew assembleDebug
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: test-reports
        path: app/build/reports/tests/testDebugUnitTest
        if-no-files-found: ignore
