name: Bundle minimal WEB
description: Bundle a minimal World English Bible (John 1-2 and Hebrews 1-2 only) into bundled-assets/
runs:
  using: composite
  steps:
  - shell: bash
    run: |
      mkdir -p bundled-assets/bundled/translations
      curl -fsSL "https://ebible.org/Scriptures/engwebp_usfm.zip" -o full-engwebp.zip
      bash .github/scripts/make-minimal-web.sh full-engwebp.zip bundled-assets/bundled/translations/engwebp.zip
      printf 'engwebp\tWorld English Bible\teng\n' > bundled-assets/bundled/list.tsv
