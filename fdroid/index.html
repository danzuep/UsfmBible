<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UsfmBible on F-Droid</title>
<h1>UsfmBible</h1>
<p>Add this repository in F-Droid (Settings, Repositories) to install and update UsfmBible:</p>
<p><a id="u"></a></p>
<script>
  var u = location.origin + location.pathname.replace(/[^/]*$/, '') + 'fdroid/repo';
  var a = document.getElementById('u');
  a.href = 'fdroidrepos://' + u.replace(/^https?:\/\//, '');
  a.textContent = u;
</script>
